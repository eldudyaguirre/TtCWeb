{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal de clientes | TotalCounts</title>
    <link rel="shortcut icon" href="{% static 'images/icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/default.css' %}">
</head>
<body style="background-color:#21333e;">
    <main class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card p-4 shadow-sm text-center">
                        <img src="{% static 'images/logo.svg' %}" alt="TotalCounts" style="max-height:70px;" class="mb-4">
                        <h1>Bienvenido al Portal de Clientes</h1>
                        <p class="mb-4">Sesión iniciada correctamente como <strong>{{ request.user.get_username }}</strong>.</p>
                        <a href="{% url 'logout' %}" class="btn primary-button">CERRAR SESIÓN</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
