{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de plantillas | TotalCounts</title>
    <link rel="stylesheet" href="{% static 'css/vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body { background: #21333e; color: #fff; }
        .catalog { padding: 80px 20px; }
        .catalog-card { background: #fff; color: #21333e; border-radius: 12px; padding: 24px; height: 100%; }
        .catalog-card a { text-decoration: none; }
        .catalog-card small { color: #6c757d; }
    </style>
</head>
<body>
<main class="catalog">
    <div class="container">
        <div class="mb-5">
            <h1>Plantillas disponibles</h1>
            <p>Catálogo interno para revisar diseños antes de reutilizarlos en TotalCounts.</p>
        </div>
        <div class="row g-4">
            {% for slug, template_name in templates.items %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="catalog-card">
                    <h3>{{ slug }}</h3>
                    <p><small>{{ template_name }}</small></p>
                    <a class="btn btn-primary" href="{% url 'template_preview' slug=slug %}">Abrir plantilla</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</main>
</body>
</html>
