{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso administrativo | TotalCounts</title>
    <link rel="shortcut icon" href="{% static 'images/icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body class="admin-login-page">
    <div class="admin-login-card">
        <div class="admin-login-brand">
            <img src="{% static 'images/logosvg.svg' %}" alt="TotalCounts">
        </div>
        <div class="admin-login-kicker">TOTALCOUNTS</div>
        <h1>Acceso administrativo</h1>
        <p>Ingresa con tu usuario de administración de TotalCounts.</p>

        {% if error %}
            <div class="admin-alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'admin_login' %}" autocomplete="off">
            {% csrf_token %}
            <div class="admin-field">
                <label for="admin-username">Usuario</label>
                <input id="admin-username" type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus>
            </div>

            <div class="admin-field">
                <label for="admin-password">Contraseña</label>
                <input id="admin-password" type="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="admin-primary-button">Iniciar sesión</button>
        </form>

        <a href="{% url 'home' %}" class="admin-back-link">← Volver a TotalCounts</a>
    </div>
</body>
</html>
